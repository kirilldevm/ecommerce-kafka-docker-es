name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ec2-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment: production
    runs-on: [self-hosted, linux, x64, ec2]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker tools
        run: |
          docker --version
          docker compose version

      - name: Write .env from GitHub secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.EC2_ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "Secret EC2_ENV_FILE is empty or missing."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE_CONTENT" > .env
          chmod 600 .env

      - name: Build and deploy stack
        run: |
          docker compose pull --ignore-pull-failures
          docker compose up -d --build

      - name: Prune dangling Docker images
        run: docker image prune -f
