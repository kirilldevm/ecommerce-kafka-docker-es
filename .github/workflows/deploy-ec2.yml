name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: ec2-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment: production
    runs-on: [self-hosted, linux, x64, ec2]
    timeout-minutes: 45
    env:
      COMPOSE_BAKE: "false"
      COMPOSE_PARALLEL_LIMIT: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker tools
        run: |
          docker --version
          docker compose version

      - name: Write .env from GitHub secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.EC2_ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "Secret EC2_ENV_FILE is empty or missing."
            exit 1
          fi
          printf '%s\n' "$ENV_FILE_CONTENT" > .env
          chmod 600 .env

      - name: Build and deploy stack
        run: |
          services=(
            postgres
            redis
            zookeeper
            kafka
            kafka-init
            kafka-ui
            elasticsearch
            kibana
            db-init
            auth-service
            product-service
            order-service
            payment-service
            delivery-service
            search-service
            analytics-service
            api-gateway
            frontend
            prometheus
            grafana
          )

          for svc in "${services[@]}"; do
            echo "Building ${svc}..."
            docker compose build "${svc}"
          done

          docker compose up -d

      - name: Prune dangling Docker images
        run: docker image prune -f
